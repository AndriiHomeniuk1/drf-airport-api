services:
  airport_api:
    build:
      context: .

    env_file:
      - .env

    ports:
      - "8000:8000"

    command: >
      sh -c "python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000"
    
    volumes:
      - ./:/airport_api
      - my_static:/files/static

    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:/var/lib/postgresql

volumes:
  my_db:
  my_static:
